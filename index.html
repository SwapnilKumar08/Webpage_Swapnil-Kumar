<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swapnil Kumar | Webpage</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
    }

    p {
      margin: 0 0 16px;
      line-height: 1.6;
      color: var(--muted);
    }

    .accent {
      color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      color: #0b1120;
      background: var(--accent);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
    }

    .button.secondary {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hi, I'm <span class="accent">Swapnil Kumar</span></h1>
    <p>
      Welcome to my webpage. This is a simple, responsive landing page with a
      clean layout that can be extended with projects, skills, and contact details.
    </p>
    <div class="actions">
      <a class="button" href="#about">Explore</a>
      <a class="button secondary" href="mailto:hello@example.com">Contact</a>
    </div>
    <section id="about">
      <p>
        Built with plain HTML and CSS for fast loading and easy customization.
      </p>
    </section>
  </main>
</body>
</html>
